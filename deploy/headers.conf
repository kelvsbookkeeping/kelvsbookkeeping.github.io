# Security headers for the app. Copy to /etc/nginx/snippets/portfolio-headers.conf and keep this file as the
# source of truth. Included in EVERY location of deploy/nginx.conf: a location with its own add_header drops
# the server's.
# The script-src hash is the inline theme script in index.html. Edit that script and the hash changes: run
# `npm run csp:check` (scripts/csp-hash.mjs), put the hash it prints here, and reload nginx. A stale hash
# blocks the script and the site paints in the wrong theme.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-cZmSgieJncrgYREpB1bdOMX6lQXRbolVNlQusnCYKI0='; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
