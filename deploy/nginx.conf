# Example nginx site for the built SPA: upload dist/ to /var/www/portfolio, copy this file to
# /etc/nginx/sites-available/<your-domain> (linked in sites-enabled) and the two snippets next to it to
# /etc/nginx/snippets/. Replace example.com with your domain. `certbot --nginx` adds the 443 server and the
# http -> https redirect on first issue.
#
# The `limit_req zone=general` line needs a zone in the http block of nginx.conf, e.g.
#   limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# Delete that line if you do not want a rate limit.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    root /var/www/portfolio;
    index index.html;

    include /etc/nginx/snippets/portfolio-headers.conf;

    # Vite's hashed bundles never change under the same name.
    location ^~ /assets/ {
        include /etc/nginx/snippets/portfolio-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted fonts: replaced only with a new file name, so cache like the bundles.
    location ^~ /fonts/ {
        include /etc/nginx/snippets/portfolio-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Videos and pictures are cached for a year: ship a changed picture under a NEW file name
    # (scripts/make-image-variants.mjs writes new copies), or visitors keep the old one.
    location ~* ^/(media|images)/ {
        include /etc/nginx/snippets/portfolio-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Standalone sample pages with their own inline styles and scripts.
    location ^~ /demos/ {
        include /etc/nginx/snippets/portfolio-demos-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ $uri.html =404;
    }

    location = /version.json {
        include /etc/nginx/snippets/portfolio-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Any other path with a file extension is a real file or a 404, never the app (index.html with a 200
    # reads as a broken /llms.txt or /robots.txt to crawlers). The ^~ on /assets/, /fonts/ and /demos/ keeps
    # this regex from taking their files.
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/portfolio-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Every app route (/, /work/<chapter>, /proof, /contact...) is index.html; the router draws the page.
    location / {
        include /etc/nginx/snippets/portfolio-headers.conf;
        limit_req zone=general burst=20 nodelay;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
