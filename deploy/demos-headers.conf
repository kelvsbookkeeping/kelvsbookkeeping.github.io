# Headers for /demos/: standalone sample pages (sites, funnels, a plan) with their own inline styles and
# scripts. The placeholder pages make no outside requests. If your own demo pages load web fonts, photos or
# CDN scripts, add those hosts here (font-src, img-src, script-src). Framing stays same-origin only.
# Copy to /etc/nginx/snippets/portfolio-demos-headers.conf.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
