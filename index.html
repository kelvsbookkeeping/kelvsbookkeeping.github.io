<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Kelvin Dienzo | Accounts Assistant &amp; Bookkeeper</title>
    <meta data-static-meta name="description" content="Accounts Assistant, Bookkeeper and Irish VAT Specialist. I help business owners keep their books current and file VAT accurately and on time." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#05070C" />

    <meta property="og:type" content="website" />
    <!-- Link previews: absolute URLs on your domain. Re-render og-image.png with scripts/make-og-image.mjs. -->
    <meta property="og:site_name" content="Kelvin Dienzo - KelvsBookkeeping" />
    <meta property="og:url" content="https://kelvsbookkeeping.github.io/" />
    <meta property="og:title" content="Kelvin Dienzo | Accounts Assistant &amp; Bookkeeper" />
    <meta property="og:description" content="Accounts Assistant, Bookkeeper and Irish VAT Specialist. I help business owners keep their books current and file VAT accurately and on time." />
    <meta property="og:image" content="https://kelvsbookkeeping.github.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kelvin Dienzo, Accounts Assistant | Bookkeeper | Irish VAT Specialist" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kelvsbookkeeping.github.io/og-image.png" />

    <!-- Dark by default; a saved light pick is applied before first paint, so it never flashes dark first.
         Mirrors src/lib/theme.ts. The deploy CSP allows this script by hash: after any edit run npm run csp:check. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F3F6FC')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
